# Tooling config proposed in the PR #9 review (quality gates).
# Kept tool-only so `pytest -q` still works without pytest-cov installed;
# CI passes the --cov flags explicitly.

# PEP 621 project metadata (the "About" for the backend service). This is
# metadata only — the app is run via uvicorn, not pip-installed — so no
# [build-system] is declared and the quality-gate tools below are unaffected.
[project]
name = "campuseats"
version = "1.0.0"
description = "CampusEats — a peer-to-peer campus meal-pickup matching platform (FastAPI + Redis backend)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "NYCU CSIC30211 — team thc1006" }]
keywords = ["fastapi", "redis", "campus", "food-delivery", "agile", "scrum", "mvp"]

[project.urls]
Homepage = "https://campuseat.hsuan.app"
Repository = "https://github.com/thc1006/nycu-agile-114-2-CSIC30211"

[tool.ruff]
line-length = 100
target-version = "py312"
# Lint uses ruff's DEFAULT rule set (pyflakes F + the E4/E7/E9 pycodestyle
# subset), which is already clean on this codebase, so `ruff check` is a green
# hard gate. To widen later: run `ruff check --fix --select I,B,UP` to baseline
# the existing code, then add `[tool.ruff.lint] select = ["E","F","I","B","UP"]`.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["app"]
# Use CPython 3.12+ sys.monitoring instead of the legacy settrace C tracer.
# With branch coverage the settrace core roughly doubled total wall-clock here
# (134s -> 59s); sysmon collects the same data with near-zero overhead. Requires
# Python >= 3.12 (guaranteed by requires-python above).
core = "sysmon"

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# Start lenient; tighten over time.
disallow_untyped_defs = false
