apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: campuseats
spec:
  # Headless service: gives the StatefulSet a stable DNS name "redis" that the
  # backend connects to via REDIS_HOST=redis.
  clusterIP: None
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
