apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: campuseats
  labels:
    app.kubernetes.io/part-of: campuseats
  annotations:
    # Strip the /api prefix before forwarding: backend routes live at the root
    # (/auth, /orders, /health, ...), so /api/health -> /health upstream.
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    # Auto-provision a Let's Encrypt cert for the host below via the
    # Cloudflare DNS-01 ClusterIssuer; drop this annotation (and the tls block)
    # if you terminate TLS elsewhere.
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - campuseat.hsuan.app
      secretName: campuseat-tls
  rules:
    - host: campuseat.hsuan.app
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
