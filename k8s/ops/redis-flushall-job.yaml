# One-shot maintenance Job: wipe the entire Redis datastore for a clean
# initial test/demo environment (accounts + orders + ratings — everything).
#
# Runs in-cluster against the `redis` Service (no password; see redis/), so it
# works without external kubectl/redis access. It is APPLIED by the same GitOps
# reconciler that deploys the rest of k8s/. A completed Job is immutable, so a
# re-apply with an unchanged spec is a no-op and will NOT flush again; this
# manifest is removed from the repo in a follow-up commit once it has run.
#
# DESTRUCTIVE + IRREVERSIBLE. Bump the name (date suffix) to run another wipe.
apiVersion: batch/v1
kind: Job
metadata:
  name: redis-flushall-20260605
  labels:
    app.kubernetes.io/part-of: campuseats
    app.kubernetes.io/component: ops-oneshot
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: campuseats
        app.kubernetes.io/component: ops-oneshot
    spec:
      restartPolicy: Never
      containers:
        - name: flushall
          image: redis:7
          command: ["sh", "-c"]
          args:
            - |
              set -e
              echo "DBSIZE before: $(redis-cli -h redis DBSIZE)"
              redis-cli -h redis FLUSHALL
              echo "DBSIZE after:  $(redis-cli -h redis DBSIZE)"
              echo "FLUSHALL_DONE"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
