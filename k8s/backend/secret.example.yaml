# Template only. Copy to secret.yaml (gitignored), fill in real values, and apply
# it separately — never commit the real secret.
#
#   cp k8s/backend/secret.example.yaml k8s/backend/secret.yaml
#   # generate a strong key:  python -c "import secrets; print(secrets.token_urlsafe(48))"
#   kubectl -n campuseats apply -f k8s/backend/secret.yaml
#
# The backend refuses to start if JWT_SECRET_KEY is missing, a known placeholder,
# or shorter than 32 bytes (see app/config.py).
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: campuseats
type: Opaque
stringData:
  JWT_SECRET_KEY: "REPLACE_WITH_A_STRONG_RANDOM_KEY_AT_LEAST_32_BYTES"
  # Leave empty if Redis has no password (default deployment here).
  REDIS_PASSWORD: ""
