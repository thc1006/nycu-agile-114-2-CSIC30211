name: Build & Push Images

# Builds the backend and frontend container images and pushes them to GHCR, then
# bumps the kustomize image tags so `kubectl apply -k k8s/` always deploys the
# image built from the latest commit (GitOps-lite).

on:
  push:
    branches: [main]
    tags: ["v*"]
    # The tag-bump commit only touches k8s/kustomization.yaml — don't let it
    # re-trigger this workflow (belt-and-suspenders with the [skip ci] marker).
    paths-ignore:
      - "k8s/**"
  workflow_dispatch:

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/campuseats-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/campuseats-frontend

jobs:
  build:
    name: Build & push
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to push the tag-bump commit back to main
      packages: write   # to push images to GHCR
    outputs:
      sha_tag: ${{ steps.vars.outputs.sha_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Short SHA
        id: vars
        run: echo "sha_tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.vars.outputs.sha_tag }}
            type=semver,pattern={{version}}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/backend.Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Frontend metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.vars.outputs.sha_tag }}
            type=semver,pattern={{version}}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/frontend.Dockerfile
          build-args: |
            VITE_API_BASE=/api
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      # Only update the manifests on default-branch builds (not on vX.Y tags,
      # which often point at an already-released commit).
      - name: Bump kustomize image tags
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          curl -sSLo /usr/local/bin/kustomize https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64 || \
            { curl -sSL https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash && mv kustomize /usr/local/bin/; }
          chmod +x /usr/local/bin/kustomize || true
          cd k8s
          kustomize edit set image "${BACKEND_IMAGE}=${BACKEND_IMAGE}:${SHA_TAG}"
          kustomize edit set image "${FRONTEND_IMAGE}=${FRONTEND_IMAGE}:${SHA_TAG}"
        env:
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
          SHA_TAG: ${{ steps.vars.outputs.sha_tag }}

      - name: Commit & push tag bump
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          if git diff --quiet -- k8s/kustomization.yaml; then
            echo "No image tag change; skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git commit -m "ci: bump image tags to ${SHA_TAG} [skip ci]"
          git push origin HEAD:main
        env:
          SHA_TAG: ${{ steps.vars.outputs.sha_tag }}
